<article class="post">
<header class="post-header">
<h1 class="post-title">$title$</h1>
<p class="post-meta">
<time datetime="$date$">$date$</time>
$if(tags)$
<span class="post-tags">$for(tags)$<a class="tag" href="$url$">$name$</a>$sep$ $endfor$</span>
$endif$
</p>
</header>
<div class="post-body">
$body$
</div>
</article>
