<h1 class="page-title">$title$</h1>
<ul class="post-list">
$for(posts)$
<li class="post-list-item">
<time class="post-list-date" datetime="$date$">$date$</time>
<a class="post-list-title" href="$url$">$title$</a>
$if(tags)$<span class="post-tags">$for(tags)$<a class="tag" href="$url$">$name$</a>$sep$ $endfor$</span>$endif$
</li>
$endfor$
</ul>
