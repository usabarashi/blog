<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 280" role="img" width="672" height="280">
  <title>security-review privilege boundary: the workflow app, the broker, and the ephemeral runner</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #e6e6e6; stroke: #333333; stroke-width: 1.5; }
    .outer { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .edge { stroke: #333333; stroke-width: 1.5; fill: none; }
    .label { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; fill: #222222; text-anchor: middle; }
    .title { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; font-weight: 600; fill: #222222; text-anchor: middle; }
    .sub { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: middle; }
    .left { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: start; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="672" height="280" fill="#ffffff" />

  <rect class="outer" x="12" y="48" width="250" height="174" rx="5" />
  <text class="title" x="137" y="72">workflow container</text>
  <text class="sub" x="137" y="91">workflow app (private netns)</text>

  <rect class="box" x="28" y="104" width="218" height="44" rx="4" />
  <text class="label" x="137" y="123">workflow worker</text>
  <text class="sub" x="137" y="140">prepare / finalize activities</text>

  <text class="left" x="28" y="174">GitHub App private key</text>
  <text class="left" x="28" y="194">Slack bot token</text>
  <text class="left" x="28" y="214">baseline (read / write)</text>

  <rect class="box" x="292" y="130" width="100" height="52" rx="4" />
  <text class="label" x="342" y="153">broker</text>
  <text class="sub" x="342" y="171">root on host</text>

  <rect class="outer" x="422" y="48" width="238" height="174" rx="5" />
  <text class="title" x="541" y="72">ephemeral runner</text>
  <text class="sub" x="541" y="91">one per agent step</text>

  <rect class="box" x="438" y="104" width="206" height="44" rx="4" />
  <text class="label" x="541" y="123">review agent</text>
  <text class="sub" x="541" y="140">LLM key injected by broker</text>

  <text class="left" x="438" y="174">LLM API key</text>
  <text class="left" x="438" y="194">repo (read-only at /work)</text>
  <text class="left" x="438" y="214">report (/out/report.json)</text>

  <line class="edge" x1="262" y1="156" x2="292" y2="156" marker-end="url(#arrow)" />
  <line class="edge" x1="392" y1="156" x2="422" y2="156" marker-end="url(#arrow)" />

  <text class="sub" x="336" y="260">Only the review section crosses the broker boundary.</text>
</svg>
