<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224" role="img" width="640" height="224">
  <title>Process layout and the two boundaries of the VOICEVOX MCP server</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #e6e6e6; stroke: #333333; stroke-width: 1.5; }
    .file { fill: #f7f7f7; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .edge { stroke: #333333; stroke-width: 1.5; fill: none; }
    .label { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; fill: #222222; text-anchor: middle; }
    .edge-label { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 13px; fill: #444444; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="640" height="224" fill="#ffffff" />

  <rect class="file" x="232" y="8" width="120" height="32" rx="5" />
  <text class="label" x="292" y="29">VOICEVOX.md</text>
  <line class="edge" x1="292" y1="40" x2="292" y2="70" marker-end="url(#arrow)" />
  <text class="edge-label" x="278" y="58" text-anchor="end">read</text>

  <rect class="box" x="12" y="70" width="100" height="44" rx="5" />
  <text class="label" x="62" y="97">Host app</text>
  <rect class="box" x="232" y="70" width="120" height="44" rx="5" />
  <text class="label" x="292" y="97">MCP server</text>
  <rect class="box" x="452" y="70" width="130" height="44" rx="5" />
  <text class="label" x="517" y="97">voicevox-daemon</text>

  <line class="edge" x1="112" y1="92" x2="232" y2="92" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text class="edge-label" x="172" y="84">JSON-RPC / stdio</text>
  <line class="edge" x1="352" y1="92" x2="452" y2="92" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text class="edge-label" x="402" y="84">Unix socket</text>
  <text class="edge-label" x="402" y="108">synthesize</text>

  <rect class="box" x="232" y="170" width="120" height="40" rx="5" />
  <text class="label" x="292" y="195">Audio output</text>
  <rect class="box" x="452" y="170" width="130" height="40" rx="5" />
  <text class="label" x="517" y="195">VOICEVOX Core</text>

  <line class="edge" x1="292" y1="114" x2="292" y2="170" marker-end="url(#arrow)" />
  <text class="edge-label" x="276" y="145" text-anchor="end">play</text>
  <line class="edge" x1="517" y1="114" x2="517" y2="170" marker-end="url(#arrow)" />
  <text class="edge-label" x="501" y="145" text-anchor="end">loads</text>
</svg>
