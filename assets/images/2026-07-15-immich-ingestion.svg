<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 300" role="img" width="672" height="300">
  <title>Two ways to bring photos into Immich: an external library that reads files in place, and managed storage that owns them</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #e6e6e6; stroke: #333333; stroke-width: 1.5; }
    .group { fill: none; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .edge { stroke: #333333; stroke-width: 1.5; fill: none; }
    .label { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; fill: #222222; text-anchor: middle; }
    .sub { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: middle; }
    .note { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="672" height="300" fill="#ffffff" />

  <text class="label" x="336" y="26">Two ways to bring photos into Immich</text>

  <rect class="group" x="16" y="44" width="312" height="200" rx="8" />
  <text class="sub" x="172" y="66">External library</text>

  <rect class="box" x="40" y="84" width="264" height="44" rx="5" />
  <text class="label" x="172" y="111">Photos exported to disk</text>

  <line class="edge" x1="172" y1="128" x2="172" y2="152" marker-end="url(#arrow)" />

  <rect class="box" x="40" y="152" width="264" height="44" rx="5" />
  <text class="label" x="172" y="179">Immich reads and indexes</text>

  <text class="note" x="172" y="222">originals stay where they are</text>

  <rect class="group" x="344" y="44" width="312" height="200" rx="8" />
  <text class="sub" x="500" y="66">Managed storage</text>

  <rect class="box" x="368" y="84" width="264" height="44" rx="5" />
  <text class="label" x="500" y="111">Upload from the mobile app</text>

  <line class="edge" x1="500" y1="128" x2="500" y2="152" marker-end="url(#arrow)" />

  <rect class="box" x="368" y="152" width="264" height="44" rx="5" />
  <text class="label" x="500" y="179">Immich stores the originals</text>

  <text class="note" x="500" y="222">date folders with original names</text>

  <text class="note" x="336" y="276">Keeping both leaves two copies of the same photo</text>
</svg>
