<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 288" role="img" width="672" height="288">
  <title>git and ssh sign through the Secretive agent socket; the key stays in the Secure Enclave and GitHub verifies with the registered public key</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #e6e6e6; stroke: #333333; stroke-width: 1.5; }
    .group { fill: none; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .edge { stroke: #333333; stroke-width: 1.5; fill: none; }
    .label { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; fill: #222222; text-anchor: middle; }
    .sub { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: middle; }
    .edge-label { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: middle; }
    .note { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="672" height="288" fill="#ffffff" />

  <rect class="box" x="16" y="96" width="184" height="84" rx="5" />
  <text class="label" x="108" y="124">git / ssh</text>
  <text class="sub" x="108" y="146">sign: ssh-keygen -Y sign</text>
  <text class="sub" x="108" y="164">auth: ssh</text>

  <rect class="group" x="256" y="80" width="232" height="92" rx="8" />
  <text class="label" x="372" y="70">Secretive</text>

  <rect class="box" x="272" y="88" width="200" height="72" rx="5" />
  <text class="label" x="372" y="114">SecretAgent</text>
  <text class="sub" x="372" y="136">socket.ssh</text>
  <text class="sub" x="372" y="154">SSH_AUTH_SOCK</text>

  <rect class="box" x="272" y="184" width="200" height="64" rx="5" />
  <text class="label" x="372" y="210">Secure Enclave</text>
  <text class="sub" x="372" y="232">private key stays here</text>

  <rect class="box" x="512" y="96" width="144" height="84" rx="5" />
  <text class="label" x="584" y="124">GitHub</text>
  <text class="sub" x="584" y="146">authentication key</text>
  <text class="sub" x="584" y="164">signing key</text>

  <line class="edge" x1="200" y1="132" x2="272" y2="132" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text class="edge-label" x="236" y="122">request</text>
  <text class="edge-label" x="236" y="150">signature</text>

  <line class="edge" x1="372" y1="160" x2="372" y2="184" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text class="edge-label" x="380" y="177" text-anchor="start">sign</text>

  <polyline class="edge" points="108,96 108,40 584,40 584,96" marker-end="url(#arrow)" />
  <text class="edge-label" x="346" y="32">signed commit or authentication attempt</text>

  <text class="note" x="336" y="280">the enclave returns a signature, never the private key</text>
</svg>
