<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 320" role="img" width="672" height="320">
  <title>The app repository ships the NixOS module; the host imports it and sets options</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #e6e6e6; stroke: #333333; stroke-width: 1.5; }
    .group { fill: none; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .edge { stroke: #333333; stroke-width: 1.5; fill: none; }
    .label { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; fill: #222222; text-anchor: middle; }
    .sub { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="672" height="320" fill="#ffffff" />

  <rect class="group" x="8" y="56" width="200" height="200" rx="8" />
  <text class="label" x="108" y="76">App repository</text>

  <rect class="box" x="24" y="88" width="168" height="56" rx="5" />
  <text class="label" x="108" y="112">App code</text>
  <text class="sub" x="108" y="130">no placement config</text>

  <rect class="box" x="24" y="160" width="168" height="72" rx="5" />
  <text class="label" x="108" y="180">NixOS module</text>
  <text class="sub" x="108" y="198">execution settings</text>
  <text class="sub" x="108" y="214">unit, timer, isolation</text>

  <rect class="group" x="224" y="56" width="232" height="232" rx="8" />
  <text class="label" x="340" y="76">NixOS host</text>

  <rect class="box" x="240" y="88" width="200" height="80" rx="5" />
  <text class="label" x="340" y="112">NixOS config</text>
  <text class="sub" x="340" y="130">imports module</text>
  <text class="sub" x="340" y="146">sets options</text>

  <rect class="box" x="240" y="216" width="200" height="48" rx="5" />
  <text class="label" x="340" y="238">systemd unit on host</text>
  <text class="sub" x="340" y="254">runs the app</text>

  <rect class="group" x="472" y="56" width="192" height="200" rx="8" />
  <text class="label" x="568" y="76">Cloud (Terraform-managed)</text>

  <rect class="box" x="488" y="96" width="160" height="40" rx="5" />
  <text class="label" x="568" y="121">DB</text>

  <rect class="box" x="488" y="152" width="160" height="40" rx="5" />
  <text class="label" x="568" y="177">Logs</text>

  <rect class="box" x="488" y="208" width="160" height="40" rx="5" />
  <text class="label" x="568" y="233">Identity</text>

  <line class="edge" x1="108" y1="144" x2="108" y2="160" marker-end="url(#arrow)" />
  <line class="edge" x1="192" y1="180" x2="240" y2="140" marker-end="url(#arrow)" />
  <line class="edge" x1="192" y1="212" x2="240" y2="240" marker-end="url(#arrow)" />
  <line class="edge" x1="440" y1="128" x2="462" y2="128" />
  <line class="edge" x1="462" y1="116" x2="462" y2="228" />
  <line class="edge" x1="462" y1="116" x2="486" y2="116" marker-end="url(#arrow)" />
  <line class="edge" x1="462" y1="172" x2="486" y2="172" marker-end="url(#arrow)" />
  <line class="edge" x1="462" y1="228" x2="486" y2="228" marker-end="url(#arrow)" />
</svg>
