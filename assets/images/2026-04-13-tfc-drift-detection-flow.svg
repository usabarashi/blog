<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 240" role="img" width="672" height="240">
  <title>Daily scheduled workflow that creates a plan-only run per workspace and posts findings to Slack</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #e6e6e6; stroke: #333333; stroke-width: 1.5; }
    .group { fill: none; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .edge { stroke: #333333; stroke-width: 1.5; fill: none; }
    .label { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; fill: #222222; text-anchor: middle; }
    .sub { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: middle; }
    .note { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; fill: #444444; text-anchor: middle; }
    .step { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 13px; fill: #222222; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="672" height="240" fill="#ffffff" />

  <rect class="box" x="8" y="60" width="128" height="56" rx="5" />
  <text class="label" x="72" y="84">GitHub Actions</text>
  <text class="sub" x="72" y="102">cron / manual</text>

  <line class="edge" x1="136" y1="88" x2="156" y2="88" marker-end="url(#arrow)" />

  <rect class="box" x="156" y="60" width="160" height="56" rx="5" />
  <text class="label" x="236" y="84">Drift detection</text>
  <text class="sub" x="236" y="102">one TypeScript file</text>

  <line class="edge" x1="316" y1="88" x2="336" y2="88" marker-end="url(#arrow)" />

  <rect class="group" x="336" y="32" width="212" height="136" rx="8" />
  <text class="label" x="442" y="50">HCP Terraform API</text>

  <rect class="box" x="348" y="58" width="188" height="26" rx="4" />
  <text class="step" x="442" y="76">1. list workspaces</text>

  <rect class="box" x="348" y="90" width="188" height="26" rx="4" />
  <text class="step" x="442" y="108">2. create plan-only run</text>

  <rect class="box" x="348" y="122" width="188" height="26" rx="4" />
  <text class="step" x="442" y="140">3. poll until finished</text>

  <line class="edge" x1="548" y1="88" x2="568" y2="88" marker-end="url(#arrow)" />

  <rect class="box" x="568" y="60" width="96" height="56" rx="5" />
  <text class="label" x="616" y="84">Slack</text>
  <text class="sub" x="616" y="102">findings only</text>

  <text class="note" x="336" y="200">Steps 2 and 3 repeat for every workspace, one at a time</text>
  <text class="note" x="336" y="220">A plan-only run never applies, so the state is left untouched</text>
</svg>
