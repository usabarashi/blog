name: build

# Build verification only. Nothing is deployed from this workflow: the
# publication method (private repo + GitHub Pages vs. private/public split) is
# still undecided, so publishing is intentionally not wired up here.
#
# TODO(deploy): add a separate workflow once the repository visibility and the
# Pages setup are decided. See docs/deployment.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so that a moved tag cannot change what
      # runs. The trailing comment records the release for updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Renders the site and asserts that the output has no drafts/ directory
      # and that every link is relativized.
      - name: Build and render the site
        run: nix build --print-build-logs .#checks.x86_64-linux.site
